name = "circuit-gateway"
main = "worker.js"
account_id = "5e09cd27e2878baba3bba9f7fef6e66f"
compatibility_date = "2026-09-01"

# api.decisioncircuits.com: issues API keys and proxies POST /v1/systemone to the Modal endpoints.
routes = [{ pattern = "api.decisioncircuits.com", custom_domain = true }]

[vars]
MODAL_URLS = '{"circuit-1.7b":"https://james-73074--circuit-1-7b.modal.run","circuit-8b":"https://james-73074--circuit-8b.modal.run","circuit-vl-4b":"https://james-73074--circuit-vl-4b.modal.run","circuit-audio-7b":"https://james-73074--circuit-audio-7b.modal.run"}'
DEFAULT_MODEL = "circuit-1.7b"
# The local tier: model name -> Cloudflare Tunnel hostname of a machine at home, used only
# while a Modal container is booting (see gateway/local-tier.md). Empty map = off, which is
# the default. Never point this at api.decisioncircuits.com: the Worker would fetch itself.
LOCAL_URLS = '{"circuit-1.7b":"https://mac-1-7b.decisioncircuits.com","circuit-8b":"https://mac-8b.decisioncircuits.com"}'
KEY_DAILY_QUOTA = "1000"      # advertised on issued keys; enforced as KEY_LIMIT per minute below

[[kv_namespaces]]
binding = "KEYS"
id = "af80ab5a71b14172a964086fe9d5785a"

# Rate limits live in Workers' own limiter (free, unmetered), not in KV writes.
# These must be [[ratelimits]]: written as [[unsafe.bindings]] with type = "ratelimit"
# wrangler accepts them as unsafe metadata, env.X.limit() answers success on every
# call, and nothing is ever limited. Verified after the change by exceeding each one.
[[ratelimits]]
name = "KEY_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 60          # questions per key per minute, the self-serve tier
  period = 60

[[ratelimits]]
name = "PRO_LIMIT"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 1200        # a key raised by hand: a few thousand items read in minutes
  period = 60

[[ratelimits]]
name = "GLOBAL_LIMIT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 3000        # across all keys; the GPU spend ceiling is max_containers, not this
  period = 60

[[ratelimits]]
name = "SIGNUP_LIMIT"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 3           # key requests per address per minute
  period = 60
