[project]
name = "decision-circuits"
version = "0.5.1"
description = "Deterministic decision gates over calibrated model answers: a small DSL that compiles to System One requests, evaluates AND/OR/NOT/threshold/argmax/majority/verify/order gates with explicit uncertainty, and renders the circuit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "James Barney" }]
keywords = ["decision-circuits", "system-one", "typesafe", "calibration", "gates", "llm", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=2.44,<4"]
anthropic = ["anthropic>=1.0,<2"]
langchain = ["langchain>=1.4,<2"]
openai-agents = ["openai-agents>=0.22"]
claude = ["claude-agent-sdk>=0.2"]
otel = ["opentelemetry-api>=1.20"]
all = ["opentelemetry-api>=1.20", "openai>=2.44,<4", "anthropic>=1.0,<2", "langchain>=1.4,<2", "openai-agents>=0.22", "claude-agent-sdk>=0.2"]

[project.urls]
Homepage = "https://decisioncircuits.com"
Documentation = "https://github.com/Barneyjm/decision-circuits/tree/main/docs"
Source = "https://github.com/Barneyjm/decision-circuits"
Issues = "https://github.com/Barneyjm/decision-circuits/issues"
Changelog = "https://github.com/Barneyjm/decision-circuits/blob/main/CHANGELOG.md"
Models = "https://huggingface.co/jbarney"
Article = "https://towardsdatascience.com/attaining-llm-certainty-with-ai-decision-circuits/"

[dependency-groups]
dev = ["pytest>=8", "opentelemetry-sdk>=1.20", "ruff>=0.6", "httpx>=0.25", "langchain>=1.4,<2", "openai-agents>=0.22", "claude-agent-sdk>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_circuits"]

[tool.hatch.build.targets.sdist]
include = ["src/decision_circuits", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"
